<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Altıdünya — Harita</title>
<style>
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:#12100e;overflow:hidden;font-family:'IBM Plex Sans',system-ui,sans-serif}
  #sahne{width:100%;height:100%;overflow:hidden;cursor:grab;touch-action:none;position:relative}
  #sahne.tutuyor{cursor:grabbing}
  #harita{position:absolute;transform-origin:0 0;user-select:none;-webkit-user-drag:none;
    filter:drop-shadow(0 10px 30px rgba(0,0,0,.6))}
  #araclar{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:5}
  #araclar button{width:42px;height:42px;border-radius:8px;border:1px solid #3a322a;
    background:#1c1815;color:#e8ded0;font-size:20px;cursor:pointer}
  #araclar button:active{transform:translateY(1px)}
  #ipucu{position:fixed;left:14px;bottom:14px;color:#a3968a;font-size:12px;z-index:5;
    background:#1c1815cc;padding:4px 10px;border-radius:8px;border:1px solid #3a322a}
  #yok{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#a3968a;
    text-align:center;padding:2em;font-size:15px;line-height:1.6}
</style>
</head>
<body>
<div id="sahne">
  <img id="harita" src="dunya_haritasi.jpg" alt="Altıdünya haritası"
       onerror="document.getElementById('yok').style.display='flex';this.style.display='none'">
</div>
<div id="yok" style="display:none">Harita görseli henüz yüklenmedi.<br>
  <span style="font-size:13px;opacity:.7">(dunya_haritasi.jpg bekleniyor)</span></div>
<div id="araclar">
  <button id="art">+</button>
  <button id="eks">−</button>
  <button id="sifir" title="Sığdır">⌂</button>
</div>
<div id="ipucu">Sürükle · tekerlek/çimdik ile yakınlaş</div>

<script>
(function(){
  const sahne = document.getElementById('sahne');
  const img = document.getElementById('harita');
  let s=1, tx=0, ty=0, minS=0.2;

  function uygula(){ img.style.transform = `translate(${tx}px,${ty}px) scale(${s})`; }
  function sigdir(){
    if(!img.naturalWidth) return;
    const k = Math.min(sahne.clientWidth/img.naturalWidth, sahne.clientHeight/img.naturalHeight);
    s = k; minS = k*0.5;
    tx = (sahne.clientWidth - img.naturalWidth*s)/2;
    ty = (sahne.clientHeight - img.naturalHeight*s)/2;
    uygula();
  }
  img.onload = sigdir;
  window.addEventListener('resize', sigdir);
  if(img.complete && img.naturalWidth) sigdir();

  function zoomNokta(f, cx, cy){
    const yeni = Math.min(6, Math.max(minS, s*f));
    tx = cx - (cx - tx) * (yeni/s);
    ty = cy - (cy - ty) * (yeni/s);
    s = yeni; uygula();
  }
  sahne.addEventListener('wheel', e=>{
    e.preventDefault();
    zoomNokta(e.deltaY<0 ? 1.15 : 1/1.15, e.clientX, e.clientY);
  }, {passive:false});
  document.getElementById('art').onclick = ()=>zoomNokta(1.3, sahne.clientWidth/2, sahne.clientHeight/2);
  document.getElementById('eks').onclick = ()=>zoomNokta(1/1.3, sahne.clientWidth/2, sahne.clientHeight/2);
  document.getElementById('sifir').onclick = sigdir;

  /* sürükle + çimdik */
  let isaretciler = new Map(), sonMesafe = 0, sonOrta = null;
  sahne.addEventListener('pointerdown', e=>{
    sahne.setPointerCapture(e.pointerId);
    isaretciler.set(e.pointerId, {x:e.clientX, y:e.clientY});
    sahne.classList.add('tutuyor');
  });
  sahne.addEventListener('pointermove', e=>{
    if(!isaretciler.has(e.pointerId)) return;
    const onceki = isaretciler.get(e.pointerId);
    isaretciler.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(isaretciler.size === 1){
      tx += e.clientX - onceki.x; ty += e.clientY - onceki.y; uygula();
    } else if(isaretciler.size === 2){
      const [a,b] = [...isaretciler.values()];
      const mesafe = Math.hypot(a.x-b.x, a.y-b.y);
      const orta = {x:(a.x+b.x)/2, y:(a.y+b.y)/2};
      if(sonMesafe){ zoomNokta(mesafe/sonMesafe, orta.x, orta.y); }
      if(sonOrta){ tx += orta.x - sonOrta.x; ty += orta.y - sonOrta.y; uygula(); }
      sonMesafe = mesafe; sonOrta = orta;
    }
  });
  ['pointerup','pointercancel'].forEach(ev=>sahne.addEventListener(ev, e=>{
    isaretciler.delete(e.pointerId);
    if(isaretciler.size < 2){ sonMesafe = 0; sonOrta = null; }
    if(!isaretciler.size) sahne.classList.remove('tutuyor');
  }));
})();
</script>
</body>
</html>
