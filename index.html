<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Altıdünya — Parti Defteri</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
</head>
<body>
<div id="app">

  <!-- GİRİŞ -->
  <section id="view-login" class="view">
    <div class="login-box">
      <h1 class="logo">ALTIDÜNYA</h1>
      <p class="logo-sub">Yarılma · Parti Defteri</p>
      <input type="password" id="login-pass" placeholder="Şifre" autocomplete="current-password">
      <button id="login-btn" class="btn primary">Gir</button>
      <p id="login-err" class="err hidden">Şifre yanlış.</p>
      <p id="mode-badge" class="mode-badge"></p>
    </div>
  </section>

  <!-- ANA -->
  <section id="view-main" class="view hidden">
    <header id="topbar">
      <span class="logo small">ALTIDÜNYA</span>
      <nav id="tabs">
        <button class="tab active" data-tab="karakterler">Karakterler</button>
        <button class="tab" data-tab="harita">Harita</button>
        <button class="tab" data-tab="dunya">Dünya</button>
        <button class="tab" data-tab="kasa">Kasa &amp; Envanter</button>
        <button class="tab" data-tab="notlar">Notlar<span id="not-dot" class="dot hidden"></span></button>
        <button class="tab hidden" data-tab="dm" id="tab-dm">DM</button>
      </nav>
      <div class="top-right">
        <span id="sync-badge" title="Senkron durumu">●</span>
        <span id="role-badge"></span>
        <button id="logout-btn" class="btn ghost small-btn">Çık</button>
      </div>
    </header>

    <main id="content">
      <div id="pane-karakterler" class="pane">
        <iframe id="char-frame" src="karakterler.html" title="Karakterler"></iframe>
      </div>
      <div id="pane-harita" class="pane pane-frame hidden"><iframe class="tab-frame" data-src="harita.html" title="Harita"></iframe></div>
      <div id="pane-dunya" class="pane pane-frame hidden"><iframe class="tab-frame" data-src="dunya.html" title="Dünya"></iframe></div>
      <div id="pane-kasa" class="pane hidden"></div>
      <div id="pane-notlar" class="pane hidden"></div>
      <div id="pane-dm" class="pane hidden"></div>
    </main>
  </section>
</div>

<div id="modal-root" class="hidden"><div id="modal-card"></div></div>
<div id="toast" class="hidden"></div>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>
